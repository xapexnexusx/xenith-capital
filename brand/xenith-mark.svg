<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <title>Xenith Capital</title>
  <defs>
    <radialGradient id="glass" cx="62%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1D1530"/><stop offset="0.55" stop-color="#0C0914"/><stop offset="1" stop-color="#060409"/>
    </radialGradient>
    <linearGradient id="strand" gradientUnits="userSpaceOnUse" x1="33" y1="97" x2="93" y2="31">
      <stop offset="0" stop-color="#FF3D8E" stop-opacity="0.85"/><stop offset="0.70" stop-color="#FF3D8E"/>
      <stop offset="0.70" stop-color="#22D3EE"/><stop offset="1" stop-color="#7DF9FF"/>
    </linearGradient>
    <linearGradient id="blade" gradientUnits="userSpaceOnUse" x1="35" y1="35" x2="93" y2="93">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FFFFFF" opacity="0.035"/></pattern>
    <clipPath id="tile"><rect x="2" y="2" width="124" height="124" rx="28"/></clipPath>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#glass)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#scan)"/>
  <g clip-path="url(#tile)">
    <!-- the second blade: the record, thin violet -->
    <line x1="36" y1="36" x2="92" y2="92" stroke="url(#blade)" stroke-width="2.6" filter="url(#soft)"/>
    <!-- the strand: pink body rising to a cyan head, toward the zenith -->
    <line x1="33" y1="97" x2="93" y2="31" stroke="url(#strand)" stroke-width="5.2" stroke-linecap="round" filter="url(#glow)"/>
    <!-- the zenith -->
    <path d="M101 14 L103.1 21.4 L110.5 23.5 L103.1 25.6 L101 33 L98.9 25.6 L91.5 23.5 L98.9 21.4 Z" fill="#E9FEFF" filter="url(#glow)"/>
  </g>
  <rect x="2.75" y="2.75" width="122.5" height="122.5" rx="27.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
