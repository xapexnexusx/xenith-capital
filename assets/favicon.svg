<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="frame">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="#04060a"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#00f0ff" stroke-opacity="0.14"/>

  <g clip-path="url(#frame)">
    <!-- THE VIGIL: machine-aperture eye -->
    <!-- soft glow pass -->
    <g filter="url(#glow)" opacity="0.6">
      <path d="M6 32 Q32 9 58 32 Q32 55 6 32 Z" fill="none" stroke="#00f0ff" stroke-width="3.6" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="12.8" fill="none" stroke="#00f0ff" stroke-width="3.4"
              stroke-dasharray="15.7 4.4" stroke-dashoffset="7.8" transform="rotate(45 32 32)"/>
    </g>
    <!-- crisp pass -->
    <path d="M6 32 Q32 9 58 32 Q32 55 6 32 Z" fill="none" stroke="#00f0ff" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="12.8" fill="none" stroke="#00f0ff" stroke-width="3"
            stroke-dasharray="15.7 4.4" stroke-dashoffset="7.8" transform="rotate(45 32 32)"/>
    <circle cx="32" cy="32" r="5.2" fill="#cffaff"/>
  </g>
</svg>
