<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="frame">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="#04060a"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#00f0ff" stroke-opacity="0.14"/>

  <g clip-path="url(#frame)">
    <!-- THE ORBITAL: perspective ring around the core, broken behind it -->
    <!-- soft glow pass -->
    <g filter="url(#glow)" opacity="0.6">
      <g transform="rotate(-16 32 32)">
        <path d="M22.8 23.5 A 24 9.2 0 1 0 41.2 23.5" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="32" cy="32" r="6.8" fill="#00f0ff"/>
    </g>
    <!-- crisp pass -->
    <g transform="rotate(-16 32 32)">
      <path d="M22.8 23.5 A 24 9.2 0 1 0 41.2 23.5" fill="none" stroke="#00f0ff" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <circle cx="32" cy="32" r="6.4" fill="#cffaff"/>
  </g>
</svg>
