<style>
:root{
  --x-void:#04060a;
  --x-panel:#0a0f16;
  --x-cyan:#00f0ff;
  --x-red:#ff2d3c;
  --x-text:#d7e3ee;
  --x-dim:#8fa8c4;
  --x-line:rgba(0,240,255,.14);
  --x-font-d:'Space Grotesk',system-ui,sans-serif;
  --x-font-m:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(55% 45% at 50% 40%, rgba(0,240,255,.055) 0%, transparent 70%),
    radial-gradient(130% 100% at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%),
    var(--x-void);
  color:var(--x-text);
  font-family:var(--x-font-d);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,240,255,.028) 0 1px, transparent 1px 3px);
}
::selection{background:rgba(0,240,255,.28);color:#ffffff}
.deck{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:3rem 1.5rem;
}
.mark{
  width:44px;
  height:44px;
  color:var(--x-cyan);
  opacity:.92;
  margin-bottom:2.25rem;
  filter:drop-shadow(0 0 10px rgba(0,240,255,.35));
}
.eyebrow{
  font-family:var(--x-font-m);
  font-size:.72rem;
  font-weight:500;
  letter-spacing:.42em;
  text-indent:.42em;
  color:var(--x-cyan);
  text-shadow:0 0 12px rgba(0,240,255,.45);
  margin-bottom:1.4rem;
}
h1{
  font-family:var(--x-font-d);
  font-weight:700;
  font-size:clamp(3rem,10vw,7rem);
  line-height:1.04;
  letter-spacing:.01em;
  text-wrap:balance;
  color:var(--x-text);
  text-shadow:0 0 18px rgba(0,240,255,.32), 0 0 70px rgba(0,240,255,.14);
  margin-bottom:1.5rem;
}
.subline{
  font-family:var(--x-font-m);
  font-size:.82rem;
  letter-spacing:.08em;
  color:var(--x-dim);
  margin-bottom:2.75rem;
}
.extraction{
  font-family:var(--x-font-m);
  font-size:.78rem;
  font-weight:500;
  letter-spacing:.5em;
  text-indent:.5em;
  color:var(--x-red);
  text-shadow:0 0 14px rgba(255,45,60,.5);
  margin-bottom:1.6rem;
}
.actions{
  display:flex;
  justify-content:center;
  align-items:stretch;
  gap:1rem;
  flex-wrap:wrap;
}
.btn{
  display:inline-block;
  font-family:var(--x-font-m);
  font-size:.8rem;
  font-weight:500;
  letter-spacing:.24em;
  text-indent:.24em;
  text-decoration:none;
  color:var(--x-cyan);
  padding:1.05rem 2.2rem;
  border:1px solid rgba(0,240,255,.55);
  background:rgba(0,240,255,.04);
  transition:background .22s ease, border-color .22s ease, box-shadow .22s ease, text-shadow .22s ease, transform .12s ease;
}
.btn:hover{
  background:rgba(0,240,255,.1);
  border-color:var(--x-cyan);
  box-shadow:0 0 26px rgba(0,240,255,.28), inset 0 0 14px rgba(0,240,255,.1);
  text-shadow:0 0 10px rgba(0,240,255,.65);
}
.btn:focus-visible{
  outline:1px dashed var(--x-cyan);
  outline-offset:5px;
  background:rgba(0,240,255,.1);
  box-shadow:0 0 26px rgba(0,240,255,.28);
}
.btn:active{transform:translateY(1px)}
.btn-ghost{
  color:var(--x-text);
  border-color:rgba(143,168,196,.42);
  background:transparent;
}
.btn-ghost:hover{
  color:var(--x-cyan);
  border-color:var(--x-cyan);
  background:rgba(0,240,255,.06);
  box-shadow:0 0 26px rgba(0,240,255,.22), inset 0 0 14px rgba(0,240,255,.08);
  text-shadow:0 0 10px rgba(0,240,255,.55);
}
.foot{
  position:relative;
  z-index:1;
  width:100%;
  border-top:1px solid var(--x-line);
  padding:1.15rem 1.5rem;
  text-align:center;
  font-family:var(--x-font-m);
  font-size:.62rem;
  letter-spacing:.3em;
  text-indent:.3em;
  color:var(--x-dim);
}
@media (max-width:560px){
  .actions{flex-direction:column;width:100%;max-width:340px}
  .btn{width:100%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
